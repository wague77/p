<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Partants PMU</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #04180f; color: #ecfdf5; font-family: "Segoe UI", system-ui, sans-serif; }
      button, input { font: inherit; }
      button { min-height: 44px; cursor: pointer; }
      .top { position: sticky; top: 0; z-index: 5; background: #062214; border-bottom: 1px solid rgba(245, 197, 66, .25); padding: 12px 16px 8px; }
      .brand, .tools, .between, .pick, .combo, .partant { display: flex; align-items: center; gap: 10px; }
      .logo { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font-weight: 900; color: #062214; background: linear-gradient(135deg, #fcd34d, #d97706); }
      h1, h2, h3, p { margin: 0; }
      h1 { font-size: 22px; color: #fffbeb; }
      h2 { margin: 8px 0; color: #fffbeb; }
      .kicker { color: #fcd34d; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; }
      .tools { margin-top: 10px; }
      input, .gold, .chip, .course { border-radius: 12px; border: 1px solid #065f46; }
      input { min-height: 44px; background: #0a3320; color: #ecfdf5; padding: 0 10px; }
      .gold { background: #fbbf24; color: #062214; font-weight: 800; border: 0; padding: 0 14px; }
      .when { margin-top: 8px; color: #a7f3d0; text-transform: capitalize; }
      .wrap { max-width: 920px; margin: 0 auto; padding: 16px 16px 92px; display: flex; flex-direction: column; gap: 12px; }
      .warn, .card, .course, .partant { background: #0b3222; border: 1px solid #065f46; border-radius: 16px; padding: 12px; }
      .warn { background: rgba(251, 191, 36, .12); color: #fef3c7; border-color: rgba(251, 191, 36, .35); }
      .err { border-color: #f87171; }
      .row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
      .chip { flex: 0 0 auto; background: #0a3320; color: #ecfdf5; padding: 0 14px; font-weight: 700; }
      .chip.on, .nav .on { background: #fbbf24; color: #062214; }
      .course { width: 100%; text-align: left; color: inherit; display: flex; gap: 12px; align-items: center; }
      .num, .badge { width: 44px; height: 44px; border-radius: 999px; display: grid; place-items: center; background: #fbbf24; color: #062214; font-weight: 900; flex: 0 0 auto; }
      .badge.sm { width: 32px; height: 32px; }
      .grow { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 3px; }
      small, .music { color: #a7f3d0; }
      .goldline { border-color: rgba(251, 191, 36, .45); }
      .cote { color: #fcd34d; }
      .partant.off { opacity: .55; }
      .pick, .combo { background: #08291b; border-radius: 12px; padding: 8px; margin-top: 8px; }
      .nav { position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(3, 1fr); background: #04180f; border-top: 1px solid rgba(245, 197, 66, .25); }
      .nav button { background: transparent; color: #a7f3d0; border: 0; font-weight: 700; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="./app.js"></script>
  </body>
</html>
